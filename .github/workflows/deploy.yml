name: Deploy

# Déclenché manuellement ou sur tag de release
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environnement cible"
        required: true
        type: choice
        options:
          - staging
          - production
  push:
    tags:
      - "v*"

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.38.x"

jobs:
  # ─── Android ──────────────────────────────────────────────────────────────
  deploy-android:
    name: Deploy Android (${{ github.event.inputs.environment || 'production' }})
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK
        run: |
          flutter build apk --release \
            --dart-define=FLAVOR=${{ github.event.inputs.environment || 'prod' }} \
            --dart-define=API_URL=${{ vars.API_URL }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-android
          path: build/app/outputs/flutter-apk/app-release.apk

      # ─── Firebase App Distribution ──────────────────────────────────────
      - name: Deploy to Firebase App Distribution
        if: github.event.inputs.environment == 'staging' || startsWith(github.ref, 'refs/tags/')
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          file: build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: |
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}

  # ─── iOS ──────────────────────────────────────────────────────────────────
  deploy-ios:
    name: Deploy iOS (${{ github.event.inputs.environment || 'production' }})
    runs-on: macos-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build iOS (no codesign)
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=FLAVOR=${{ github.event.inputs.environment || 'prod' }} \
            --dart-define=API_URL=${{ vars.API_URL }}

